<!DOCTYPE html>
<html lang="de">
<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Squash</title>

	<style>

		*, *::before, *::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--bg: #1a1d23;
			--surface: #22262e;
			--surface-2: #2a2f39;
			--border: #333844;
			--accent: #d4a55a;
			--accent-dim: rgba( 212, 165, 90, 0.15 );
			--red: #e06c6c;
			--text: #e8eaf0;
			--text-dim: #8a909e;
			--radius: 10px;
		}

		body {
			background: var( --bg );
			color: var( --text );
			font-family: 'DM Sans', system-ui, sans-serif;
			min-height: 100vh;
			padding: 32px 16px 64px;
		}

		h1 {
			font-family: 'DM Serif Display', Georgia, serif;
			font-size: 2rem;
			font-weight: 400;
			color: var( --accent );
			text-align: center;
			margin-bottom: 8px;
		}

		.subtitle {
			text-align: center;
			color: var( --text-dim );
			font-size: 0.9rem;
			margin-bottom: 32px;
		}

		/* Drop Zone */

		.drop-zone {
			border: 2px dashed var( --border );
			border-radius: var( --radius );
			background: var( --surface );
			padding: 48px 24px;
			text-align: center;
			cursor: pointer;
			transition: border-color 0.2s, background 0.2s;
			max-width: 720px;
			margin: 0 auto 32px;
		}

		.drop-zone.drag-over {
			border-color: var( --accent );
			background: var( --accent-dim );
		}

		.drop-zone__icon {
			font-size: 3rem;
			margin-bottom: 12px;
			display: block;
		}

		.drop-zone__title {
			font-size: 1.1rem;
			font-weight: 600;
			margin-bottom: 6px;
		}

		.drop-zone__hint {
			color: var( --text-dim );
			font-size: 0.85rem;
		}

		input[type="file"] {
			display: none;
		}

		/* Controls */

		.controls {
			max-width: 720px;
			margin: 0 auto 24px;
			background: var( --surface );
			border-radius: var( --radius );
			padding: 20px 24px;
			display: flex;
			align-items: center;
			gap: 20px;
			flex-wrap: wrap;
		}

		.control-group {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.control-group--quality {
			flex: 1;
			min-width: 200px;
		}

		/* Toggle switch (filename cleanup) */

		.opt {
			display: flex;
			align-items: center;
			gap: 9px;
			font-size: 0.85rem;
			color: var( --text-dim );
			cursor: pointer;
			user-select: none;
			white-space: nowrap;
		}

		.opt input {
			position: absolute;
			opacity: 0;
			pointer-events: none;
		}

		.toggle {
			width: 38px;
			height: 22px;
			border-radius: 11px;
			background: var( --surface-2 );
			border: 1px solid var( --border );
			position: relative;
			flex-shrink: 0;
			transition: background 0.15s, border-color 0.15s;
		}

		.toggle::after {
			content: '';
			position: absolute;
			top: 2px;
			left: 2px;
			width: 16px;
			height: 16px;
			border-radius: 50%;
			background: var( --text-dim );
			transition: transform 0.15s, background 0.15s;
		}

		.opt input:checked + .toggle {
			background: var( --accent-dim );
			border-color: var( --accent );
		}

		.opt input:checked + .toggle::after {
			transform: translateX( 16px );
			background: var( --accent );
		}

		.opt input:focus-visible + .toggle {
			outline: 2px solid var( --accent );
			outline-offset: 2px;
		}

		.quality-label {
			font-size: 0.85rem;
			color: var( --text-dim );
			white-space: nowrap;
			transition: opacity 0.15s;
		}

		.quality-value {
			font-size: 1rem;
			font-weight: 700;
			color: var( --accent );
			min-width: 36px;
			text-align: right;
			transition: opacity 0.15s;
		}

		.is-disabled {
			opacity: 0.4;
		}

		input[type="range"] {
			flex: 1;
			min-width: 120px;
			-webkit-appearance: none;
			appearance: none;
			height: 4px;
			border-radius: 2px;
			background: var( --border );
			outline: none;
			cursor: pointer;
			transition: opacity 0.15s;
		}

		input[type="range"]:disabled {
			opacity: 0.4;
			cursor: default;
		}

		input[type="range"]::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 18px;
			height: 18px;
			border-radius: 50%;
			background: var( --accent );
			cursor: pointer;
		}

		input[type="number"],
		select {
			background: var( --surface-2 );
			border: 1px solid var( --border );
			border-radius: 6px;
			color: var( --text );
			font-family: inherit;
			font-size: 0.9rem;
			padding: 5px 8px;
			outline: none;
		}

		input[type="number"] {
			width: 80px;
			-moz-appearance: textfield;
		}

		input[type="number"]::-webkit-outer-spin-button,
		input[type="number"]::-webkit-inner-spin-button {
			-webkit-appearance: none;
		}

		select {
			cursor: pointer;
			padding-right: 8px;
		}

		select option {
			background: var( --surface-2 );
			color: var( --text );
		}

		input[type="number"]:focus,
		select:focus {
			border-color: var( --accent );
		}

		input[type="range"]::-moz-range-thumb {
			width: 18px;
			height: 18px;
			border-radius: 50%;
			background: var( --accent );
			border: none;
			cursor: pointer;
		}

		.btn {
			padding: 8px 18px;
			border-radius: 6px;
			border: none;
			font-family: inherit;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
			transition: opacity 0.15s;
		}

		.btn:disabled {
			opacity: 0.4;
			cursor: default;
		}

		.btn--accent {
			background: var( --accent );
			color: #1a1d23;
		}

		.btn--ghost {
			background: var( --surface-2 );
			color: var( --text-dim );
			border: 1px solid var( --border );
		}

		.btn--danger {
			background: transparent;
			color: var( --red );
			border: 1px solid var( --red );
		}

		.btn:not(:disabled):hover {
			opacity: 0.85;
		}

		/* File List */

		.file-list {
			max-width: 720px;
			margin: 0 auto;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.file-list:empty {
			display: none;
		}

		/* File Item */

		.file-item {
			background: var( --surface );
			border-radius: var( --radius );
			padding: 12px 16px;
			display: grid;
			grid-template-columns: 52px 1fr auto;
			align-items: center;
			gap: 14px;
			border: 1px solid var( --border );
			transition: border-color 0.2s;
		}

		.file-item--done {
			border-color: var( --border );
		}

		.file-item--error {
			border-color: var( --red );
		}

		.file-item__thumb {
			width: 52px;
			height: 52px;
			border-radius: 6px;
			object-fit: cover;
			background: var( --surface-2 );
			display: flex;
			align-items: center;
			justify-content: center;
			color: var( --text-dim );
			font-size: 0.7rem;
			overflow: visible;
			flex-shrink: 0;
			position: relative;
		}

		.file-item__thumb img {
			width: 52px;
			height: 52px;
			border-radius: 6px;
			object-fit: cover;
			display: block;
		}

		.file-item__preview {
			position: absolute;
			z-index: 30;
			left: 0;
			bottom: calc( 100% + 8px );
			display: none;
			padding: 4px;
			background: var( --surface-2 );
			border: 1px solid var( --border );
			border-radius: 8px;
			box-shadow: 0 12px 32px rgba( 0, 0, 0, 0.5 );
			pointer-events: none;
		}

		.file-item__thumb:hover .file-item__preview {
			display: block;
		}

		.file-item__preview img {
			display: block;
			max-width: min( 480px, 80vw );
			max-height: 70vh;
			width: auto;
			height: auto;
			border-radius: 4px;
		}

		.file-item__info {
			min-width: 0;
		}

		.file-item__original {
			font-size: 0.75rem;
			color: var( --text-dim );
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			margin-bottom: 2px;
		}

		.file-item__name {
			font-size: 0.9rem;
			font-weight: 600;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			margin-bottom: 4px;
		}

		.file-item__meta {
			font-size: 0.75rem;
			color: var( --text-dim );
			display: flex;
			align-items: center;
			gap: 6px;
			flex-wrap: wrap;
		}

		.size-arrow {
			color: var( --text-dim );
			opacity: 0.5;
		}

		.size-saving {
			color: var( --accent );
			font-weight: 600;
		}

		.file-item__status {
			font-size: 0.8rem;
			font-weight: 600;
			margin-top: 4px;
		}

		.file-item__status--processing { color: var( --accent ); }
		.file-item__status--done { color: var( --accent ); }
		.file-item__status--error { color: var( --red ); }

		.file-item__actions {
			display: flex;
			flex-direction: row;
			gap: 8px;
			align-items: center;
			flex-shrink: 0;
		}

		.file-type-badge {
			font-size: 0.75rem;
			color: var( --text-dim );
			font-weight: 600;
			letter-spacing: 0.02em;
		}

		.btn--download {
			background: var( --accent );
			color: #1a1d23;
			font-size: 0.82rem;
			padding: 7px 16px;
			border-radius: 6px;
			font-weight: 600;
			text-decoration: none;
		}

		.btn--remove {
			background: transparent;
			border: none;
			color: var( --text-dim );
			font-size: 1rem;
			cursor: pointer;
			padding: 4px;
			line-height: 1;
			transition: color 0.15s;
		}

		.btn--remove:hover {
			color: var( --red );
		}

		.file-item__rotate {
			display: flex;
			flex-direction: column;
			gap: 2px;
		}

		.btn--rotate {
			background: transparent;
			border: none;
			color: var( --text );
			font-size: 1.125rem;
			cursor: pointer;
			padding: 0 4px;
			line-height: 1;
			transition: color 0.15s;
		}

		.btn--rotate:hover {
			color: var( --accent );
		}

		.btn--crop {
			background: transparent;
			border: none;
			color: var( --text );
			cursor: pointer;
			padding: 2px 4px;
			line-height: 0;
			display: flex;
			align-items: center;
			transition: color 0.15s;
		}

		.btn--crop:hover {
			color: var( --accent );
		}

		.btn--crop.is-active {
			color: var( --accent );
		}

		.file-item__width {
			width: 62px;
			background: var( --surface-2 );
			border: 1px solid var( --border );
			border-radius: 6px;
			color: var( --text );
			font-family: inherit;
			font-size: 0.82rem;
			padding: 5px 7px;
			outline: none;
			-moz-appearance: textfield;
		}

		.file-item__width::-webkit-outer-spin-button,
		.file-item__width::-webkit-inner-spin-button {
			-webkit-appearance: none;
		}

		.file-item__width:focus {
			border-color: var( --accent );
		}

		.file-item__format {
			background: var( --surface-2 );
			border: 1px solid var( --border );
			border-radius: 6px;
			color: var( --text );
			font-family: inherit;
			font-size: 0.82rem;
			padding: 5px 7px;
			outline: none;
			cursor: pointer;
		}

		.file-item__format option {
			background: var( --surface-2 );
			color: var( --text );
		}

		.file-item__format:focus {
			border-color: var( --accent );
		}

		/* Bottom bar */

		.bottom-bar {
			max-width: 720px;
			margin: 16px auto 0;
			display: none;
			align-items: center;
			gap: 10px;
		}

		.bottom-bar--visible {
			display: flex;
		}

		.bottom-bar__count {
			font-size: 0.85rem;
			color: var( --text-dim );
			flex: 1;
		}

		.bottom-bar__saving {
			font-size: 0.85rem;
			color: var( --accent );
			font-weight: 600;
		}

		.zip-name {
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.zip-name input {
			width: 140px;
			background: var( --surface-2 );
			border: 1px solid var( --border );
			border-radius: 6px;
			color: var( --text );
			font-family: inherit;
			font-size: 0.82rem;
			padding: 6px 9px;
			outline: none;
		}

		.zip-name input:focus {
			border-color: var( --accent );
		}

		.zip-name__ext {
			font-size: 0.82rem;
			color: var( --text-dim );
		}

		/* Progress */

		.progress-bar {
			width: 100%;
			height: 3px;
			background: var( --border );
			border-radius: 2px;
			margin-top: 8px;
			overflow: hidden;
		}

		.progress-bar__fill {
			height: 100%;
			background: var( --accent );
			border-radius: 2px;
			transition: width 0.3s;
			width: 0%;
		}

		/* Crop modal */

		.crop-modal {
			position: fixed;
			inset: 0;
			z-index: 100;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba( 10, 12, 16, 0.85 );
			padding: 24px;
		}

		.crop-modal--open {
			display: flex;
		}

		.crop-modal__inner {
			background: var( --surface );
			border: 1px solid var( --border );
			border-radius: var( --radius );
			padding: 20px;
			max-width: 92vw;
			max-height: 92vh;
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.crop-modal__title {
			font-size: 0.95rem;
			font-weight: 600;
			color: var( --text );
		}

		.crop-modal__title span {
			color: var( --text-dim );
			font-weight: 400;
		}

		.crop-stage {
			position: relative;
			display: inline-block;
			line-height: 0;
			margin: 0 auto;
			touch-action: none;
			user-select: none;
			max-width: 100%;
		}

		.crop-stage img {
			display: block;
			max-width: min( 80vw, 900px );
			max-height: 62vh;
			width: auto;
			height: auto;
		}

		.crop-box {
			position: absolute;
			border: 1px solid var( --accent );
			box-shadow: 0 0 0 9999px rgba( 10, 12, 16, 0.55 );
			cursor: move;
			box-sizing: border-box;
		}

		.crop-box::before {
			content: '';
			position: absolute;
			inset: 0;
			background-image:
				linear-gradient( var( --accent-dim ) 0 0 ), linear-gradient( var( --accent-dim ) 0 0 ),
				linear-gradient( var( --accent-dim ) 0 0 ), linear-gradient( var( --accent-dim ) 0 0 );
			background-repeat: no-repeat;
			background-size: 100% 1px, 100% 1px, 1px 100%, 1px 100%;
			background-position: 0 33.33%, 0 66.66%, 33.33% 0, 66.66% 0;
			pointer-events: none;
			opacity: 0.6;
		}

		.crop-handle {
			position: absolute;
			width: 14px;
			height: 14px;
			background: var( --accent );
			border: 2px solid var( --bg );
			border-radius: 50%;
			box-sizing: border-box;
		}

		.crop-handle[data-dir="nw"] { top: -7px; left: -7px; cursor: nwse-resize; }
		.crop-handle[data-dir="ne"] { top: -7px; right: -7px; cursor: nesw-resize; }
		.crop-handle[data-dir="sw"] { bottom: -7px; left: -7px; cursor: nesw-resize; }
		.crop-handle[data-dir="se"] { bottom: -7px; right: -7px; cursor: nwse-resize; }
		.crop-handle[data-dir="n"] { top: -7px; left: 50%; margin-left: -7px; cursor: ns-resize; }
		.crop-handle[data-dir="s"] { bottom: -7px; left: 50%; margin-left: -7px; cursor: ns-resize; }
		.crop-handle[data-dir="w"] { left: -7px; top: 50%; margin-top: -7px; cursor: ew-resize; }
		.crop-handle[data-dir="e"] { right: -7px; top: 50%; margin-top: -7px; cursor: ew-resize; }

		.crop-controls {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 10px;
		}

		.crop-ratios {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
		}

		.crop-chip {
			background: var( --surface-2 );
			border: 1px solid var( --border );
			border-radius: 6px;
			color: var( --text-dim );
			font-family: inherit;
			font-size: 0.8rem;
			padding: 5px 11px;
			cursor: pointer;
			transition: color 0.15s, border-color 0.15s, background 0.15s;
		}

		.crop-chip:hover {
			color: var( --text );
		}

		.crop-chip--active {
			background: var( --accent-dim );
			border-color: var( --accent );
			color: var( --accent );
		}

		.crop-exact {
			display: flex;
			align-items: center;
			gap: 6px;
			font-size: 0.8rem;
			color: var( --text-dim );
		}

		.crop-exact input {
			width: 68px;
			background: var( --surface-2 );
			border: 1px solid var( --border );
			border-radius: 6px;
			color: var( --text );
			font-family: inherit;
			font-size: 0.8rem;
			padding: 5px 7px;
			outline: none;
			-moz-appearance: textfield;
		}

		.crop-exact input::-webkit-outer-spin-button,
		.crop-exact input::-webkit-inner-spin-button {
			-webkit-appearance: none;
		}

		.crop-exact input:focus {
			border-color: var( --accent );
		}

		.crop-actions {
			display: flex;
			gap: 10px;
			margin-left: auto;
		}

		/* Google Fonts */

		@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600;700&display=swap');

	</style>

</head>
<body>

	<h1>Squash</h1>
	<p class="subtitle">Bilder per Drag & Drop konvertieren & skalieren — lokal, kein Upload</p>

	<div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Bilder hierher ziehen oder klicken zum Auswählen">
		<div class="drop-zone__title">Bilder hier ablegen</div>
		<div class="drop-zone__hint">JPG, PNG, GIF, AVIF, BMP, HEIC, HEIF, TIFF, SVG, ICO, WebP · Mehrere Dateien gleichzeitig · Klicken zum Auswählen</div>
	</div>

	<input type="file" id="fileInput" multiple accept="image/*,.heic,.heif">

	<div class="controls">

		<div class="control-group">
			<span class="quality-label">Format</span>
			<select id="formatSelect" aria-label="Zielformat">
				<option value="image/webp" data-ext="webp" data-lossy="1">WebP</option>
				<option value="image/jpeg" data-ext="jpg" data-lossy="1">JPEG</option>
				<option value="image/png" data-ext="png" data-lossy="0">PNG</option>
				<option value="image/avif" data-ext="avif" data-lossy="1">AVIF</option>
			</select>
		</div><!-- end /.control-group -->

		<div class="control-group control-group--quality">
			<span class="quality-label" id="qualityLabel">Qualität</span>
			<input
				type="range"
				id="qualitySlider"
				min="1"
				max="100"
				value="70"
				aria-label="Qualität"
			>
			<span class="quality-value" id="qualityValue">70</span>
		</div><!-- end /.control-group -->

		<div class="control-group">
			<span class="quality-label">Breite</span>
			<input
				type="number"
				id="widthInput"
				min="1"
				max="10000"
				placeholder="px"
				aria-label="Zielbreite in Pixeln (leer = Originalgröße)"
			>
		</div><!-- end /.control-group -->

		<label class="opt">
			<input type="checkbox" id="cleanNameToggle" checked>
			<span class="toggle"></span>
			<span>Dateiname bereinigen</span>
		</label>

	</div><!-- end /.controls -->

	<div class="file-list" id="fileList" role="list" aria-label="Konvertierte Dateien"></div><!-- end /.file-list -->

	<div class="bottom-bar" id="bottomBar" aria-live="polite">
		<span class="bottom-bar__count" id="bottomCount"></span>
		<span class="bottom-bar__saving" id="bottomSaving"></span>
		<div class="zip-name">
			<input
				type="text"
				id="zipNameInput"
				value="squash"
				placeholder="squash"
				aria-label="Name der ZIP-Datei"
			>
			<span class="zip-name__ext">.zip</span>
		</div><!-- end /.zip-name -->

		<button class="btn btn--ghost" id="clearBtn" aria-label="Alle Dateien entfernen">Leeren</button>
		<button class="btn btn--accent" id="downloadAllBtn" aria-label="Alle als ZIP herunterladen">Alle als ZIP</button>
	</div><!-- end /.bottom-bar -->

	<div class="crop-modal" id="cropModal" role="dialog" aria-modal="true" aria-label="Bild zuschneiden">

		<div class="crop-modal__inner">

			<div class="crop-modal__title" id="cropTitle">Zuschneiden</div>

			<div class="crop-stage" id="cropStage">
				<img id="cropImage" alt="">
			</div><!-- end /.crop-stage -->

			<div class="crop-controls">

				<div class="crop-ratios" id="cropRatios">
					<button class="crop-chip" data-ratio="free">Frei</button>
					<button class="crop-chip" data-ratio="orig">Original</button>
					<button class="crop-chip" data-ratio="1">1:1</button>
					<button class="crop-chip" data-ratio="1.3333">4:3</button>
					<button class="crop-chip" data-ratio="1.5">3:2</button>
					<button class="crop-chip" data-ratio="1.7778">16:9</button>
				</div><!-- end /.crop-ratios -->

				<label class="crop-exact">
					Feste Größe
					<input type="number" id="cropExactW" min="1" max="20000" placeholder="B">
					×
					<input type="number" id="cropExactH" min="1" max="20000" placeholder="H">
					px
				</label>

				<div class="crop-actions">
					<button class="btn btn--ghost" id="cropResetBtn">Zurücksetzen</button>
					<button class="btn btn--ghost" id="cropCancelBtn">Abbrechen</button>
					<button class="btn btn--accent" id="cropApplyBtn">Übernehmen</button>
				</div><!-- end /.crop-actions -->

			</div><!-- end /.crop-controls -->

		</div><!-- end /.crop-modal__inner -->

	</div><!-- end /.crop-modal -->

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

	<script>

		(function() {

			'use strict';

			const dropZone = document.getElementById( 'dropZone' );
			const fileInput = document.getElementById( 'fileInput' );
			const formatSelect = document.getElementById( 'formatSelect' );
			const qualitySlider = document.getElementById( 'qualitySlider' );
			const qualityLabel = document.getElementById( 'qualityLabel' );
			const qualityValue = document.getElementById( 'qualityValue' );
			const widthInput = document.getElementById( 'widthInput' );
			const cleanNameToggle = document.getElementById( 'cleanNameToggle' );
			const fileList = document.getElementById( 'fileList' );
			const clearBtn = document.getElementById( 'clearBtn' );
			const downloadAllBtn = document.getElementById( 'downloadAllBtn' );
			const zipNameInput = document.getElementById( 'zipNameInput' );
			const bottomBar = document.getElementById( 'bottomBar' );
			const bottomCount = document.getElementById( 'bottomCount' );
			const bottomSaving = document.getElementById( 'bottomSaving' );

			let files = [];

			// Read the currently selected output format

			function getSelectedFormat() {

				return formatFromOption( formatSelect.options[ formatSelect.selectedIndex ] );
			}

			function formatFromOption( opt ) {

				return {
					mime: opt.value,
					ext: opt.dataset.ext,
					lossy: opt.dataset.lossy === '1'
				};
			}

			// Look up a format by mime from the (feature-detected) global options

			function getFormatByMime( mime ) {

				const opt = formatSelect.querySelector( `option[value="${ mime }"]` );
				return opt ? formatFromOption( opt ) : null;
			}

			// Build <option> markup for a per-file format select, current one preselected

			function formatOptionsHtml( selectedMime ) {

				return Array.from( formatSelect.options ).map( ( opt ) => {
					const sel = opt.value === selectedMime ? ' selected' : '';
					return `<option value="${ opt.value }"${ sel }>${ opt.textContent }</option>`;
				}).join( '' );
			}

			// Gray out quality controls for lossless formats (PNG)

			function applyFormatUiState() {

				const lossy = getSelectedFormat().lossy;

				qualitySlider.disabled = ! lossy;
				qualityLabel.classList.toggle( 'is-disabled', ! lossy );
				qualityValue.classList.toggle( 'is-disabled', ! lossy );
			}

			formatSelect.addEventListener( 'change', applyFormatUiState );

			// Quality slider

			qualitySlider.addEventListener( 'input', () => {
				qualityValue.textContent = qualitySlider.value;
			});

			// Drop zone events

			dropZone.addEventListener( 'click', () => fileInput.click() );

			dropZone.addEventListener( 'keydown', ( e ) => {
				if ( e.key === 'Enter' || e.key === ' ' ) fileInput.click();
			});

			dropZone.addEventListener( 'dragover', ( e ) => {
				e.preventDefault();
				dropZone.classList.add( 'drag-over' );
			});

			dropZone.addEventListener( 'dragleave', ( e ) => {
				if ( ! dropZone.contains( e.relatedTarget ) ) {
					dropZone.classList.remove( 'drag-over' );
				}
			});

			dropZone.addEventListener( 'drop', ( e ) => {
				e.preventDefault();
				dropZone.classList.remove( 'drag-over' );
				handleFiles( e.dataTransfer.files );
			});

			fileInput.addEventListener( 'change', () => {
				handleFiles( fileInput.files );
				fileInput.value = '';
			});

			// File handling

			function handleFiles( rawFiles ) {

				const quality = parseInt( qualitySlider.value, 10 ) / 100;
				const targetWidth = parseInt( widthInput.value, 10 ) || 0;
				const format = getSelectedFormat();

				Array.from( rawFiles ).forEach( ( file ) => {

					if ( ! file.type.startsWith( 'image/' ) ) {
						addErrorItem( file.name, 'Kein Bildformat' );
						return;
					}

					const id = Date.now() + Math.random();
					const item = addPendingItem( file, id );
					const job = { id, file, quality, targetWidth, format, rotation: 0, cleanName: cleanNameToggle.checked, crop: null };

					convertJob( job, item );
				});

				updateActions();

			}

			function convertJob( job, item ) {

				const file = job.file;
				const isHeic = /\.(heic|heif)$/i.test( file.name ) || file.type === 'image/heic' || file.type === 'image/heif';

				if ( isHeic ) {
					heic2any({ blob: file, toType: 'image/png' })
						.then( ( convertedBlob ) => {
							processImageBlob( convertedBlob, job, item );
						})
						.catch( () => markError( item, 'HEIC konnte nicht gelesen werden' ) );
					return;
				}

				const reader = new FileReader();

				reader.onload = ( e ) => {
					processImageBlob( new Blob( [e.target.result], { type: file.type } ), job, item );
				};

				reader.onerror = () => markError( item, 'Datei konnte nicht gelesen werden' );
				reader.readAsArrayBuffer( file );

			}

			// Lazy-load the AVIF WASM encoder (browsers can't encode AVIF via canvas.toBlob)

			let avifEncoderPromise = null;

			function loadAvifEncoder() {

				if ( ! avifEncoderPromise ) {
					avifEncoderPromise = import( 'https://esm.sh/@jsquash/avif@2.1.1' )
						.then( ( mod ) => mod.encode || mod.default );
				}

				return avifEncoderPromise;
			}

			// Encode a canvas to a Blob – native toBlob for webp/jpeg/png, WASM for avif

			function encodeCanvas( canvas, ctx, format, quality ) {

				if ( format.mime === 'image/avif' ) {
					return loadAvifEncoder().then( ( encode ) => {
						const imageData = ctx.getImageData( 0, 0, canvas.width, canvas.height );
						return encode( imageData, { quality: Math.round( quality * 100 ) } );
					}).then( ( buffer ) => new Blob( [buffer], { type: 'image/avif' } ) );
				}

				const encodeQuality = format.lossy ? quality : undefined;

				return new Promise( ( resolve ) => {
					canvas.toBlob( resolve, format.mime, encodeQuality );
				});
			}

			function processImageBlob( sourceBlob, job, item ) {

				const blobUrl = URL.createObjectURL( sourceBlob );
				const img = new Image();

				img.onload = () => {

					URL.revokeObjectURL( blobUrl );

					const origW = img.naturalWidth;
					const origH = img.naturalHeight;

					// Crop source region (fractions of the original); default = full image
					let sx = 0, sy = 0, sw = origW, sh = origH;

					if ( job.crop ) {
						sx = Math.round( job.crop.x * origW );
						sy = Math.round( job.crop.y * origH );
						sw = Math.max( 1, Math.round( job.crop.w * origW ) );
						sh = Math.max( 1, Math.round( job.crop.h * origH ) );
					}

					let outW = sw;
					let outH = sh;
					let notUpscaled = false;

					if ( job.crop && job.crop.exact ) {
						// Fixed output size – may upscale, the user asked for exactly this
						outW = job.crop.exact.w;
						outH = job.crop.exact.h;
					} else if ( job.targetWidth > 0 ) {
						if ( job.targetWidth < sw ) {
							outW = job.targetWidth;
							outH = Math.round( sh * ( job.targetWidth / sw ) );
						} else {
							notUpscaled = true;
						}
					}

					// Swap output dimensions for 90°/270° rotation
					const swapped = job.rotation === 90 || job.rotation === 270;
					const finalW = swapped ? outH : outW;
					const finalH = swapped ? outW : outH;

					const canvas = document.createElement( 'canvas' );
					canvas.width = finalW;
					canvas.height = finalH;

					const ctx = canvas.getContext( '2d' );

					// JPEG has no alpha channel – fill transparent areas white instead of black
					if ( job.format.mime === 'image/jpeg' ) {
						ctx.fillStyle = '#ffffff';
						ctx.fillRect( 0, 0, finalW, finalH );
					}

					// Rotate around the canvas center, then draw the cropped + scaled image
					ctx.translate( finalW / 2, finalH / 2 );
					ctx.rotate( job.rotation * Math.PI / 180 );
					ctx.drawImage( img, sx, sy, sw, sh, -outW / 2, -outH / 2, outW, outH );

					encodeCanvas( canvas, ctx, job.format, job.quality ).then( ( blob ) => {

						if ( ! blob ) {
							markError( item, 'Konvertierung fehlgeschlagen' );
							return;
						}

						let outBase = job.file.name.replace( /\.[^.]+$/, '' );
						if ( job.cleanName ) outBase = slugify( outBase );
						const outName = outBase + '.' + job.format.ext;
						const url = URL.createObjectURL( blob );

						// Replace any previous encode of this item (e.g. after rotation)
						const existingIdx = files.findIndex( f => f.id === job.id );
						if ( existingIdx !== -1 ) {
							URL.revokeObjectURL( files[existingIdx].url );
							files.splice( existingIdx, 1 );
						}

						files.push({
							id: job.id,
							originalFile: job.file,
							quality: job.quality,
							targetWidth: job.targetWidth,
							format: job.format,
							rotation: job.rotation,
							cleanName: job.cleanName,
							crop: job.crop,
							name: outName,
							ext: job.format.ext,
							blob,
							url,
							originalSize: job.file.size
						});

						markDone( item, job, blob, url, outName, origW, origH, finalW, finalH, notUpscaled );
						updateSummary();

					}).catch( () => markError( item, 'Konvertierung fehlgeschlagen' ) );

				};

				img.onerror = () => {
					URL.revokeObjectURL( blobUrl );
					markError( item, 'Bild konnte nicht geladen werden' );
				};

				img.src = blobUrl;

			}

			function rotateItem( id, delta ) {

				const rec = files.find( f => f.id === id );
				if ( ! rec ) return;

				const item = document.querySelector( `.file-item[data-id="${ id }"]` );
				if ( ! item ) return;

				const rotation = ( ( rec.rotation + delta ) % 360 + 360 ) % 360;

				renderPending( item, rec.originalFile, 'Drehe…' );
				item.classList.remove( 'file-item--done' );

				const job = {
					id,
					file: rec.originalFile,
					quality: rec.quality,
					targetWidth: rec.targetWidth,
					format: rec.format,
					rotation,
					cleanName: rec.cleanName,
					crop: rec.crop
				};

				convertJob( job, item );

			}

			function resizeItem( id, width ) {

				const rec = files.find( f => f.id === id );
				if ( ! rec ) return;

				const targetWidth = parseInt( width, 10 ) || 0;
				if ( targetWidth === rec.targetWidth ) return;

				const item = document.querySelector( `.file-item[data-id="${ id }"]` );
				if ( ! item ) return;

				renderPending( item, rec.originalFile, 'Skaliere…' );
				item.classList.remove( 'file-item--done' );

				const job = {
					id,
					file: rec.originalFile,
					quality: rec.quality,
					targetWidth,
					format: rec.format,
					rotation: rec.rotation,
					cleanName: rec.cleanName,
					crop: rec.crop
				};

				convertJob( job, item );

			}

			function reformatItem( id, mime ) {

				const rec = files.find( f => f.id === id );
				if ( ! rec ) return;

				const format = getFormatByMime( mime );
				if ( ! format || format.mime === rec.format.mime ) return;

				const item = document.querySelector( `.file-item[data-id="${ id }"]` );
				if ( ! item ) return;

				renderPending( item, rec.originalFile, 'Konvertiere…' );
				item.classList.remove( 'file-item--done' );

				const job = {
					id,
					file: rec.originalFile,
					quality: rec.quality,
					targetWidth: rec.targetWidth,
					format,
					rotation: rec.rotation,
					cleanName: rec.cleanName,
					crop: rec.crop
				};

				convertJob( job, item );

			}

			function applyCrop( id, crop ) {

				const rec = files.find( f => f.id === id );
				if ( ! rec ) return;

				const item = document.querySelector( `.file-item[data-id="${ id }"]` );
				if ( ! item ) return;

				renderPending( item, rec.originalFile, 'Zuschneiden…' );
				item.classList.remove( 'file-item--done' );

				const job = {
					id,
					file: rec.originalFile,
					quality: rec.quality,
					targetWidth: rec.targetWidth,
					format: rec.format,
					rotation: rec.rotation,
					cleanName: rec.cleanName,
					crop
				};

				convertJob( job, item );

			}

			// DOM helpers

			function renderPending( item, file, label ) {

				item.innerHTML = `
					<div class="file-item__thumb" aria-hidden="true">…</div>
					<div class="file-item__info">
						<div class="file-item__original">${ escapeHtml( file.name ) }</div>
						<div class="file-item__name">${ label }</div>
						<div class="file-item__meta">${ formatBytes( file.size ) }
							<div class="progress-bar" style="width:80px"><div class="progress-bar__fill" style="width:60%"></div></div>
						</div>
					</div>
					<div class="file-item__actions">
						<button class="btn--remove" aria-label="Entfernen" data-id="${ item.dataset.id }">✕</button>
					</div>
				`;

				item.querySelector( '.btn--remove' ).addEventListener( 'click', () => removeItem( +item.dataset.id ) );

			}

			function addPendingItem( file, id ) {

				const item = document.createElement( 'div' );
				item.className = 'file-item';
				item.dataset.id = id;
				item.setAttribute( 'role', 'listitem' );

				fileList.appendChild( item );

				renderPending( item, file, 'Konvertiere…' );

				return item;

			}

			function addErrorItem( name, msg ) {

				const id = Date.now() + Math.random();
				const item = document.createElement( 'div' );
				item.className = 'file-item file-item--error';
				item.dataset.id = id;
				item.setAttribute( 'role', 'listitem' );

				item.innerHTML = `
					<div class="file-item__thumb" aria-hidden="true">⚠️</div>
					<div class="file-item__info">
						<div class="file-item__name">${ escapeHtml( name ) }</div>
						<div class="file-item__status file-item__status--error">${ escapeHtml( msg ) }</div>
					</div>
					<div class="file-item__actions">
						<button class="btn--remove" aria-label="Entfernen" data-id="${ id }">✕</button>
					</div>
				`;

				fileList.appendChild( item );
				item.querySelector( '.btn--remove' ).addEventListener( 'click', () => removeItem( id ) );

				updateActions();

			}

			function markDone( item, job, blob, url, outName, origW, origH, finalW, finalH, notUpscaled ) {

				const saving = Math.round( ( 1 - blob.size / job.file.size ) * 100 );
				const savingText = saving > 0
					? `<span class="size-saving">−${ saving }%</span>`
					: `<span style="color:var(--text-dim)">${ saving }%</span>`;

				const resized = origW !== finalW || origH !== finalH;
				const dimText = resized
					? `<span class="size-arrow">·</span> ${ origW }×${ origH } <span class="size-arrow">→</span> ${ finalW }×${ finalH }`
					: `<span class="size-arrow">·</span> ${ origW }×${ origH }`;

				const notUpscaledText = notUpscaled
					? `<span style="color:var(--text-dim)" title="Bild ist schmaler als Zielbreite">· Nicht vergrößert</span>`
					: '';

				const thumb = item.querySelector( '.file-item__thumb' );
				thumb.innerHTML = `
					<img src="${ url }" alt="${ escapeHtml( outName ) }">
					<div class="file-item__preview">
						<img src="${ url }" alt="${ escapeHtml( outName ) }">
					</div>
				`;

				item.querySelector( '.file-item__original' ).textContent = job.file.name;

				item.querySelector( '.file-item__name' ).textContent = outName;

				item.querySelector( '.file-item__meta' ).innerHTML = `
					${ formatBytes( job.file.size ) }
					<span class="size-arrow">→</span>
					${ formatBytes( blob.size ) }
					${ savingText }
					${ dimText }
					${ notUpscaledText }
				`;

				item.querySelector( '.file-item__actions' ).innerHTML = `
					<div class="file-item__rotate">
						<button class="btn--rotate" aria-label="Nach links drehen" title="90° nach links" data-rotate="-90">↺</button>
						<button class="btn--rotate" aria-label="Nach rechts drehen" title="90° nach rechts" data-rotate="90">↻</button>
					</div>
					<button class="btn--crop${ job.crop ? ' is-active' : '' }" aria-label="Zuschneiden" title="Zuschneiden">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg>
					</button>
					<input
						type="number"
						class="file-item__width"
						min="1"
						max="10000"
						placeholder="px"
						value="${ job.targetWidth || '' }"
						title="Breite für dieses Bild (leer = Original)"
						aria-label="Individuelle Breite für dieses Bild"
					>
					<select class="file-item__format" title="Ausgabeformat für dieses Bild" aria-label="Ausgabeformat für dieses Bild">${ formatOptionsHtml( job.format.mime ) }</select>
					<a
						href="${ url }"
						download="${ escapeHtml( outName ) }"
						class="btn btn--download"
						aria-label="${ escapeHtml( outName ) } herunterladen"
					>Download</a>
					<button class="btn--remove" aria-label="Entfernen" data-id="${ item.dataset.id }">✕</button>
				`;

				const id = +item.dataset.id;

				item.querySelectorAll( '.btn--rotate' ).forEach( ( btn ) => {
					btn.addEventListener( 'click', () => rotateItem( id, parseInt( btn.dataset.rotate, 10 ) ) );
				});

				item.querySelector( '.btn--crop' ).addEventListener( 'click', () => openCrop( id ) );

				const widthField = item.querySelector( '.file-item__width' );
				widthField.addEventListener( 'change', () => resizeItem( id, widthField.value ) );
				widthField.addEventListener( 'keydown', ( e ) => {
					if ( e.key === 'Enter' ) widthField.blur();
				});

				const formatField = item.querySelector( '.file-item__format' );
				formatField.addEventListener( 'change', () => reformatItem( id, formatField.value ) );

				item.querySelector( '.btn--remove' ).addEventListener( 'click', () => removeItem( id ) );
				item.classList.add( 'file-item--done' );

			}

			function markError( item, msg ) {

				item.classList.add( 'file-item--error' );

				let status = item.querySelector( '.file-item__status' );

				if ( ! status ) {
					status = document.createElement( 'div' );
					item.querySelector( '.file-item__info' ).appendChild( status );
				}

				status.className = 'file-item__status file-item__status--error';
				status.textContent = msg;

			}

			function removeItem( id ) {

				const item = document.querySelector( `.file-item[data-id="${ id }"]` );
				if ( item ) item.remove();

				const idx = files.findIndex( f => f.id === id );
				if ( idx !== -1 ) {
					URL.revokeObjectURL( files[idx].url );
					files.splice( idx, 1 );
				}

				updateActions();
				updateSummary();

			}

			function updateActions() {

				const hasItems = fileList.children.length > 0;
				bottomBar.classList.toggle( 'bottom-bar--visible', hasItems );

			}

			// ZIP download

			function getZipName() {

				const raw = zipNameInput.value.trim();
				const base = raw ? slugify( raw ) : 'squash';

				return base + '.zip';
			}

			downloadAllBtn.addEventListener( 'click', async () => {

				if ( ! files.length ) return;

				downloadAllBtn.disabled = true;
				downloadAllBtn.textContent = 'Packe ZIP…';

				try {

					const zip = new JSZip();

					files.forEach( ( f ) => {
						zip.file( f.name, f.blob );
					});

					const content = await zip.generateAsync({ type: 'blob' });
					const url = URL.createObjectURL( content );
					const a = document.createElement( 'a' );
					a.href = url;
					a.download = getZipName();
					a.click();
					URL.revokeObjectURL( url );

				} finally {

					downloadAllBtn.disabled = false;
					downloadAllBtn.textContent = 'Alle als ZIP';

				}

			});

			// Clear all

			clearBtn.addEventListener( 'click', () => {

				files.forEach( f => URL.revokeObjectURL( f.url ) );
				files = [];
				fileList.innerHTML = '';
				updateActions();
				updateSummary();

			});

			function updateSummary() {

				if ( ! files.length ) {
					bottomCount.textContent = '';
					bottomSaving.textContent = '';
					return;
				}

				const count = files.length;
				const totalBefore = files.reduce( ( acc, f ) => acc + f.originalSize, 0 );
				const totalAfter = files.reduce( ( acc, f ) => acc + f.blob.size, 0 );
				const saving = Math.round( ( 1 - totalAfter / totalBefore ) * 100 );

				bottomCount.textContent = `${ count } ${ count === 1 ? 'Datei' : 'Dateien' }`;

				if ( files.length >= 2 ) {
					bottomSaving.textContent = `${ formatBytes( totalBefore ) } → ${ formatBytes( totalAfter ) } · −${ saving }%`;
				} else {
					bottomSaving.textContent = '';
				}

			}

			// Utils

			function formatBytes( bytes ) {

				if ( bytes < 1024 ) return bytes + ' B';
				if ( bytes < 1024 * 1024 ) return ( bytes / 1024 ).toFixed( 1 ) + ' KB';
				return ( bytes / ( 1024 * 1024 ) ).toFixed( 2 ) + ' MB';

			}

			function escapeHtml( str ) {

				return str
					.replace( /&/g, '&amp;' )
					.replace( /</g, '&lt;' )
					.replace( />/g, '&gt;' )
					.replace( /"/g, '&quot;' );

			}

			// Transliteration map (non-ASCII → ASCII), umlauts always expanded

			const baseMap = {
				'ä': 'ae', 'ö': 'oe', 'ü': 'ue', 'ß': 'ss',
				'à': 'a', 'á': 'a', 'â': 'a', 'ã': 'a', 'å': 'a', 'æ': 'ae',
				'ç': 'c', 'è': 'e', 'é': 'e', 'ê': 'e', 'ë': 'e',
				'ì': 'i', 'í': 'i', 'î': 'i', 'ï': 'i', 'ñ': 'n',
				'ò': 'o', 'ó': 'o', 'ô': 'o', 'õ': 'o', 'ø': 'o', 'œ': 'oe',
				'ù': 'u', 'ú': 'u', 'û': 'u', 'ý': 'y', 'ÿ': 'y',
				'š': 's', 'ž': 'z', 'č': 'c', 'ć': 'c', 'đ': 'd', 'ð': 'd', 'þ': 'th'
			};

			function transliterate( str ) {

				return str.replace( /[^\x00-\x7F]/g, ( ch ) => {
					const lower = ch.toLowerCase();
					return baseMap[lower] !== undefined ? baseMap[lower] : '';
				});
			}

			// SEO-friendly slug of a base name (no extension) – matches clean-filenames

			function slugify( str ) {

				let name = str.toLowerCase();
				name = transliterate( name );
				name = name.replace( /[\s._]+/g, '-' );
				name = name.replace( /[^a-zA-Z0-9-]/g, '' );
				name = name.replace( /-+/g, '-' ).replace( /^-+|-+$/g, '' );

				return name || 'bild';
			}

			function clamp( v, min, max ) {
				return v < min ? min : ( v > max ? max : v );
			}

			// ---- Crop modal ----

			const cropModal = document.getElementById( 'cropModal' );
			const cropStage = document.getElementById( 'cropStage' );
			const cropImage = document.getElementById( 'cropImage' );
			const cropTitle = document.getElementById( 'cropTitle' );
			const cropRatios = document.getElementById( 'cropRatios' );
			const cropExactW = document.getElementById( 'cropExactW' );
			const cropExactH = document.getElementById( 'cropExactH' );
			const cropResetBtn = document.getElementById( 'cropResetBtn' );
			const cropCancelBtn = document.getElementById( 'cropCancelBtn' );
			const cropApplyBtn = document.getElementById( 'cropApplyBtn' );

			let cropCtx = null;
			let cropBoxEl = null;
			let cropDrag = null;

			function openCrop( id ) {

				const rec = files.find( f => f.id === id );
				if ( ! rec ) return;

				const file = rec.originalFile;
				const isHeic = /\.(heic|heif)$/i.test( file.name ) || file.type === 'image/heic' || file.type === 'image/heif';

				const show = ( blob ) => {
					const url = URL.createObjectURL( blob );
					cropCtx = { id, imgUrl: url };
					cropImage.onload = () => initCropStage( id, rec );
					cropImage.src = url;
					cropModal.classList.add( 'crop-modal--open' );
				};

				if ( isHeic ) {
					heic2any({ blob: file, toType: 'image/png' })
						.then( show )
						.catch( () => show( file ) );
					return;
				}

				show( file );

			}

			function initCropStage( id, rec ) {

				const stageW = cropImage.clientWidth;
				const stageH = cropImage.clientHeight;

				cropCtx.id = id;
				cropCtx.stageW = stageW;
				cropCtx.stageH = stageH;
				cropCtx.ratio = null;

				cropTitle.innerHTML = `Zuschneiden <span>· ${ escapeHtml( rec.originalFile.name ) } · ${ cropImage.naturalWidth }×${ cropImage.naturalHeight } px</span>`;

				cropExactW.value = '';
				cropExactH.value = '';

				let box;

				if ( rec.crop ) {
					box = {
						x: rec.crop.x * stageW,
						y: rec.crop.y * stageH,
						w: rec.crop.w * stageW,
						h: rec.crop.h * stageH
					};

					if ( rec.crop.exact ) {
						cropExactW.value = rec.crop.exact.w;
						cropExactH.value = rec.crop.exact.h;
						cropCtx.ratio = rec.crop.exact.w / rec.crop.exact.h;
					}
				} else {
					const w = stageW * 0.8;
					const h = stageH * 0.8;
					box = { x: ( stageW - w ) / 2, y: ( stageH - h ) / 2, w, h };
				}

				cropCtx.box = box;

				setActiveRatioChip();
				renderCropBox();

			}

			function renderCropBox() {

				if ( ! cropBoxEl ) {
					cropBoxEl = document.createElement( 'div' );
					cropBoxEl.className = 'crop-box';
					cropBoxEl.innerHTML = ['nw','ne','sw','se','n','s','w','e']
						.map( d => `<div class="crop-handle" data-dir="${ d }"></div>` ).join( '' );
					cropStage.appendChild( cropBoxEl );
					cropBoxEl.addEventListener( 'pointerdown', onCropPointerDown );
				}

				const b = cropCtx.box;
				cropBoxEl.style.left = b.x + 'px';
				cropBoxEl.style.top = b.y + 'px';
				cropBoxEl.style.width = b.w + 'px';
				cropBoxEl.style.height = b.h + 'px';

				const locked = cropCtx.ratio != null;
				cropBoxEl.querySelectorAll( '.crop-handle' ).forEach( ( h ) => {
					const edge = ['n','s','w','e'].includes( h.dataset.dir );
					h.style.display = ( locked && edge ) ? 'none' : 'block';
				});

			}

			function onCropPointerDown( e ) {

				const handle = e.target.closest( '.crop-handle' );

				cropDrag = {
					dir: handle ? handle.dataset.dir : 'move',
					startX: e.clientX,
					startY: e.clientY,
					box: Object.assign( {}, cropCtx.box )
				};

				e.preventDefault();
				window.addEventListener( 'pointermove', onCropPointerMove );
				window.addEventListener( 'pointerup', onCropPointerUp );

			}

			function onCropPointerMove( e ) {

				if ( ! cropDrag ) return;

				const dx = e.clientX - cropDrag.startX;
				const dy = e.clientY - cropDrag.startY;

				if ( cropDrag.dir === 'move' ) {
					moveCropBox( dx, dy, cropDrag.box );
				} else {
					resizeCropBox( cropDrag.dir, dx, dy, cropDrag.box );
				}

				renderCropBox();

			}

			function onCropPointerUp() {

				cropDrag = null;
				window.removeEventListener( 'pointermove', onCropPointerMove );
				window.removeEventListener( 'pointerup', onCropPointerUp );

			}

			function moveCropBox( dx, dy, start ) {

				const x = clamp( start.x + dx, 0, cropCtx.stageW - start.w );
				const y = clamp( start.y + dy, 0, cropCtx.stageH - start.h );

				cropCtx.box = { x, y, w: start.w, h: start.h };

			}

			function resizeCropBox( dir, dx, dy, start ) {

				const sW = cropCtx.stageW;
				const sH = cropCtx.stageH;
				const minS = 24;
				const ratio = cropCtx.ratio;

				if ( ratio ) {

					// Corner-only resize, anchored to the opposite corner
					const anchorX = dir.includes( 'w' ) ? ( start.x + start.w ) : start.x;
					const anchorY = dir.includes( 'n' ) ? ( start.y + start.h ) : start.y;

					const signX = dir.includes( 'w' ) ? -1 : 1;
					let width = Math.max( minS, start.w + signX * dx );
					let height = width / ratio;

					const maxW = dir.includes( 'w' ) ? anchorX : ( sW - anchorX );
					const maxH = dir.includes( 'n' ) ? anchorY : ( sH - anchorY );

					if ( width > maxW ) { width = maxW; height = width / ratio; }
					if ( height > maxH ) { height = maxH; width = height * ratio; }

					width = Math.max( minS, width );
					height = Math.max( minS, height );

					const nx = dir.includes( 'w' ) ? anchorX - width : anchorX;
					const ny = dir.includes( 'n' ) ? anchorY - height : anchorY;

					cropCtx.box = { x: nx, y: ny, w: width, h: height };
					return;
				}

				let left = start.x;
				let top = start.y;
				let right = start.x + start.w;
				let bottom = start.y + start.h;

				if ( dir.includes( 'e' ) ) right = clamp( start.x + start.w + dx, start.x + minS, sW );
				if ( dir.includes( 'w' ) ) left = clamp( start.x + dx, 0, start.x + start.w - minS );
				if ( dir.includes( 's' ) ) bottom = clamp( start.y + start.h + dy, start.y + minS, sH );
				if ( dir.includes( 'n' ) ) top = clamp( start.y + dy, 0, start.y + start.h - minS );

				cropCtx.box = { x: left, y: top, w: right - left, h: bottom - top };

			}

			function fitBoxToRatio() {

				if ( cropCtx.ratio == null ) return;

				const sW = cropCtx.stageW;
				const sH = cropCtx.stageH;
				const ratio = cropCtx.ratio;
				const b = cropCtx.box;
				const cx = b.x + b.w / 2;
				const cy = b.y + b.h / 2;

				let w = b.w;
				let h = w / ratio;

				if ( w > sW ) { w = sW; h = w / ratio; }
				if ( h > sH ) { h = sH; w = h * ratio; }

				const x = clamp( cx - w / 2, 0, sW - w );
				const y = clamp( cy - h / 2, 0, sH - h );

				cropCtx.box = { x, y, w, h };

			}

			function setActiveRatioChip() {

				const cur = cropCtx.ratio;
				const origRatio = cropImage.naturalWidth / cropImage.naturalHeight;

				cropRatios.querySelectorAll( '.crop-chip' ).forEach( ( c ) => {
					const r = c.dataset.ratio;
					let match = false;

					if ( r === 'free' ) match = cur == null;
					else if ( r === 'orig' ) match = cur != null && Math.abs( cur - origRatio ) < 0.01;
					else match = cur != null && Math.abs( cur - parseFloat( r ) ) < 0.01;

					c.classList.toggle( 'crop-chip--active', match );
				});

			}

			function closeCrop() {

				cropModal.classList.remove( 'crop-modal--open' );

				if ( cropCtx && cropCtx.imgUrl ) URL.revokeObjectURL( cropCtx.imgUrl );
				cropImage.src = '';

			}

			cropRatios.addEventListener( 'click', ( e ) => {

				const chip = e.target.closest( '.crop-chip' );
				if ( ! chip ) return;

				const r = chip.dataset.ratio;

				cropExactW.value = '';
				cropExactH.value = '';

				if ( r === 'free' ) cropCtx.ratio = null;
				else if ( r === 'orig' ) cropCtx.ratio = cropImage.naturalWidth / cropImage.naturalHeight;
				else cropCtx.ratio = parseFloat( r );

				fitBoxToRatio();
				setActiveRatioChip();
				renderCropBox();

			});

			function onExactChange() {

				const w = parseInt( cropExactW.value, 10 ) || 0;
				const h = parseInt( cropExactH.value, 10 ) || 0;

				if ( w > 0 && h > 0 ) {
					cropCtx.ratio = w / h;
					fitBoxToRatio();
				}

				setActiveRatioChip();
				renderCropBox();

			}

			cropExactW.addEventListener( 'input', onExactChange );
			cropExactH.addEventListener( 'input', onExactChange );

			cropApplyBtn.addEventListener( 'click', () => {

				const b = cropCtx.box;
				const id = cropCtx.id;

				const crop = {
					x: clamp( b.x / cropCtx.stageW, 0, 1 ),
					y: clamp( b.y / cropCtx.stageH, 0, 1 ),
					w: clamp( b.w / cropCtx.stageW, 0, 1 ),
					h: clamp( b.h / cropCtx.stageH, 0, 1 )
				};

				const ew = parseInt( cropExactW.value, 10 ) || 0;
				const eh = parseInt( cropExactH.value, 10 ) || 0;
				if ( ew > 0 && eh > 0 ) crop.exact = { w: ew, h: eh };

				// Near-full selection without a fixed size counts as "no crop"
				const full = crop.x < 0.002 && crop.y < 0.002 && crop.w > 0.998 && crop.h > 0.998;

				closeCrop();
				applyCrop( id, ( full && ! crop.exact ) ? null : crop );

			});

			cropResetBtn.addEventListener( 'click', () => {

				const id = cropCtx.id;
				closeCrop();
				applyCrop( id, null );

			});

			cropCancelBtn.addEventListener( 'click', closeCrop );

			cropModal.addEventListener( 'pointerdown', ( e ) => {
				if ( e.target === cropModal ) closeCrop();
			});

			document.addEventListener( 'keydown', ( e ) => {
				if ( e.key === 'Escape' && cropModal.classList.contains( 'crop-modal--open' ) ) closeCrop();
			});

			applyFormatUiState();
			updateActions();

		})();

	</script>

</body>
</html>
